<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Booking</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="homepage">
      <h1>Caliphate Airlines</h1>
       <p>Airline at its best</p>
        <div class="search-card">
        <h2 class="title">Passenger Details</h2>
        <form action="confirmation.html" class="search-form">
          <label for="fullname">Full Name</label>
          <input
            type="text"
            id="fullname"
            placeholder="e.g. Abu Daniel"
            required
          />
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="abu@example.com"
            required
          />
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="0805000001" required />
          <button type="submit">Confirm Booking</button>
        </form>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Caliphate Airlines</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Caliphate Airlines</h1>
       <p>Airline at its best</p>
      <h2>Book Your Flight</h2>  
      <form action="flights.html" method="GET" id="searchForm">
        <label for="from">From</label>
        <input type="text" placeholder="From" name="from" id="from" required />
        <label for="to">To</label>
        <input type="text" placeholder="To" name="to" id="to" required />
        <label for="date">Date</label>
        <input type="date" name="date" id="date" required />
        <button type="submit">Search Flights</button>
      </form>
    </div>
  </body>
</html>
